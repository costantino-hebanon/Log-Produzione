<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>LOG Produzione</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- OneSignal -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "08ba5dcc-dbd5-4c44-99c6-bf423f2eb1bb",
          serviceWorkerPath: "/OneSignalSDKWorker.js"
        });
      });
    </script>
  <style>
    /* Previene auto-zoom iOS (Safari fa zoom se font-size < 16px su input) */
    input, textarea, select { font-size: max(16px, 1em); }
  </style>
      <!-- Tema chiaro / scuro / automatico (Hebanon M.E.S., 2026-10-08).
         Va prima dell'app: applica il tema prima del primo disegno (niente
         lampo bianco). ?tema=chiaro|scuro|auto nell'indirizzo (lo passa
         l'Hub) diventa la scelta salvata. Sorgente: Hebanon-Reference/tema/. -->
    <script>
      (function () {
        var K = 'hebanon_tema', mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        try {
          var q = new URLSearchParams(location.search).get('tema');
          if (/^(chiaro|scuro|auto)$/.test(q || '')) localStorage.setItem(K, q);
        } catch (e) {}
        function applica() {
          var t = 'chiaro';
          try { t = localStorage.getItem(K) || 'chiaro'; } catch (e) {}
          document.documentElement.classList.toggle('tema-scuro', t === 'scuro' || (t === 'auto' && !!(mq && mq.matches)));
        }
        window.hebanonTema = { applica: applica };
        applica();
        if (mq && mq.addEventListener) mq.addEventListener('change', applica);
        window.addEventListener('storage', function (e) { if (e.key === K) applica(); });
      })();
    </script>
    <link rel="stylesheet" href="/tema-scuro.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
